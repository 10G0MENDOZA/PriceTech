<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>PriceTech</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
</head>

<body>

    <div class="container">

        <div class="left">

            <video autoplay muted loop>
            <source
                src="{{ url_for('static', filename='video/tech.mp4') }}"
                type="video/mp4">
        </video>

        </div>

        <div class="right">

            <div class="box">

                <h1>PriceTech</h1>

                <p class="description">
                    Comparador inteligente de precios tecnológicos
                </p>

                <form action="/buscar" method="POST">

                    <div class="search-box">

                        <input type="text" name="query" placeholder="Buscar portatil hp, memoria ram..." required>

                        <button type="submit">
                        Buscar
                    </button>

                    </div>

                    <!-- FILTRO -->
                    <div class="filters">

                        <select name="orden">

                        <option value="menor">
                            Menor precio
                        </option>

                        <option value="mayor">
                            Mayor precio
                        </option>

                    </select>

                    </div>

                </form>

            </div>

        </div>

    </div>

</body>

</html>
